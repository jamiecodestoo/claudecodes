<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room 404 · James Chugh</title>
<link rel="icon" href="v2/icon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="v2/icon/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="v2/icon/apple-touch-icon.png">
<link rel="manifest" href="v2/icon/site.webmanifest">
<meta name="theme-color" content="#2F7FD8">
<meta name="description" content="This page doesn't exist. Knock on a few doors, or ring the bell for help.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;600&family=Gaegu:wght@400;700&family=Anton&family=Mrs+Saint+Delafield&display=swap">
<script>(() => { let t = null; try { t = localStorage.getItem('jc-theme'); } catch (_) {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();</script>
<style>
html, body { margin: 0; background: #FFF8EC; }
:root[data-theme="dark"], :root[data-theme="dark"] body { background: #1A1A1A; }
*, *::before, *::after { box-sizing: border-box; }

/* =========================================================
   404 — a hotel corridor where room 404 should be
   ========================================================= */
.lost { --lo-bg: #FFF8EC; --lo-ink: #13233A; --lo-ink2: #4B5D72; --lo-wall: #F3E2C4; --lo-wall2: #EAD3AE; --lo-wood: #8A5A3B; --lo-wood2: #6E4429; --lo-gold: #D9A441; --lo-carpet: #A8323A;
  position: fixed; inset: 0; z-index: 140; overflow-y: auto; overscroll-behavior: contain; background: var(--lo-bg); color: var(--lo-ink); text-align: center;
  --lo-f: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-family: var(--lo-f); padding: 0 0 8vh; box-sizing: border-box;
  opacity: 0; visibility: hidden; transition: opacity .5s, visibility .5s; }
.lost.open { opacity: 1; visibility: visible; }
:root[data-theme="dark"] .lost { --lo-bg: #1A1A1A; --lo-ink: #F5F5F5; --lo-ink2: #C4C4C4; --lo-wall: #3A322B; --lo-wall2: #332B25; --lo-wood: #6B4630; --lo-wood2: #4E3222; --lo-carpet: #7E2830; }
.lo-top { position: relative; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 14px) clamp(16px, 3vw, 32px) 12px; }
.lo-brand { font: 800 16px/1 var(--lo-f); letter-spacing: -.02em; }
.lo-lights { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border: 0; border-radius: 999px; cursor: pointer; color: var(--lo-ink); font: 700 14px/1 var(--lo-f);
  background: rgba(255, 255, 255, .34); backdrop-filter: blur(16px) saturate(1.7); -webkit-backdrop-filter: blur(16px) saturate(1.7); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .72), 0 12px 28px -16px rgba(19, 35, 58, .5); }
:root[data-theme="dark"] .lo-lights { background: rgba(38, 38, 38, .38); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18), 0 12px 28px -14px rgba(0, 0, 0, .7); }
.lo-hd { max-width: 46rem; margin: 0 auto; padding: 4vh 20px 5vh; }
.lo-k { margin: 0; font: 700 13px/1.3 var(--lo-f); letter-spacing: .14em; text-transform: uppercase; color: var(--lo-ink2); }
.lo-hd h1 { margin: 16px 0 0; font: 800 clamp(40px, 6.4vw, 92px)/1 var(--lo-f); letter-spacing: -.055em; text-wrap: balance; }
.lo-n { display: inline-flex; color: #E4402A; }
.lo-n i { font-style: normal; display: inline-block; animation: lojig 3.2s ease-in-out infinite; }
.lo-n i:nth-child(2) { animation-delay: .25s; color: var(--lo-gold); } .lo-n i:nth-child(3) { animation-delay: .5s; }
@keyframes lojig { 0%, 70%, 100% { translate: 0 0; rotate: 0deg; } 78% { translate: 0 -12px; rotate: -8deg; } 86% { translate: 0 0; rotate: 6deg; } }
.lo-sub { margin: 18px auto 0; max-width: 44ch; font: 400 clamp(17px, 1.35vw, 20px)/1.55 var(--lo-f); color: var(--lo-ink2); }

/* the corridor */
.lo-hall { --mx: 50%; --my: 50%; position: relative; max-width: 1080px; margin: 0 auto; border-radius: 30px; overflow: hidden; isolation: isolate;
  background: linear-gradient(transparent 70%, var(--lo-wood2) 70% 71.5%, color-mix(in srgb, var(--lo-wood) 70%, var(--lo-wall)) 71.5%),
    repeating-linear-gradient(90deg, var(--lo-wall) 0 26px, var(--lo-wall2) 26px 30px);
  box-shadow: 0 40px 80px -50px rgba(19, 35, 58, .6), inset 0 0 0 1px rgba(0, 0, 0, .06); }
.lo-row { display: flex; align-items: flex-end; justify-content: center; gap: 0; padding: 70px 24px 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.lo-row::-webkit-scrollbar { display: none; }
.lo-lamp { flex: none; position: relative; align-self: flex-start; width: 46px; height: 60px; margin-top: 10px; }
.lo-lamp i { position: absolute; left: 50%; top: 10px; width: 18px; height: 26px; margin-left: -9px; border-radius: 9px 9px 4px 4px; background: #FFE9A8; box-shadow: 0 0 30px 14px rgba(255, 214, 120, .45); animation: loflick 7s steps(1) infinite; }
.lo-lamp i::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 24px; height: 6px; margin-left: -12px; border-radius: 3px; background: var(--lo-gold); }
.lo-lamp:nth-child(3) i { animation-delay: -2.3s; } .lo-lamp:nth-child(5) i { animation-delay: -4.1s; }
@keyframes loflick { 0%, 100% { opacity: 1; } 91% { opacity: .35; } 92% { opacity: 1; } 94% { opacity: .5; } 95% { opacity: 1; } }
.lo-door { flex: none; position: relative; width: 132px; height: 236px; padding: 0; border: 8px solid var(--lo-wood2); border-bottom: 0; border-radius: 6px 6px 0 0; background: #15110E; cursor: pointer; perspective: 700px; scroll-snap-align: center; font-family: inherit; color: inherit; }
.lo-in { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 6px; padding: 10px; color: #F6EBDD; background: radial-gradient(90% 60% at 50% 30%, #4A3424, #15110E); }
.lo-in .e { font-size: 38px; }
.lo-in b { font: 800 12.5px/1.2 var(--lo-f); letter-spacing: .02em; color: #FFD27A; }
.lo-in small { font: 500 12.5px/1.35 var(--lo-f); opacity: .9; }
.lo-leaf { position: absolute; inset: 0; display: block; transform-origin: 0 50%; transition: transform .9s cubic-bezier(.3, 1.3, .5, 1); backface-visibility: hidden;
  background: linear-gradient(90deg, rgba(0, 0, 0, .12), transparent 30%, rgba(255, 255, 255, .06) 70%, rgba(0, 0, 0, .14)), var(--lo-wood);
  box-shadow: inset 0 0 0 10px var(--lo-wood), inset 0 0 0 12px rgba(0, 0, 0, .18), inset 0 -110px 0 -100px rgba(0, 0, 0, .12); }
.lo-leaf::before, .lo-leaf::after { content: ""; position: absolute; left: 18px; right: 18px; border-radius: 4px; box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .16), inset 2px 2px 0 3px rgba(255, 255, 255, .06); }
.lo-leaf::before { top: 54px; height: 64px; } .lo-leaf::after { top: 130px; height: 80px; }
.lo-leaf .pl { position: absolute; left: 50%; top: 16px; translate: -50% 0; padding: 5px 10px; border-radius: 6px; background: linear-gradient(180deg, #F2CF7A, var(--lo-gold)); color: #3B2A0B; font: 800 15px/1 var(--lo-f); box-shadow: 0 3px 6px -2px rgba(0, 0, 0, .5); }
.lo-leaf .kn { position: absolute; right: 12px; top: 128px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE7A0, var(--lo-gold) 60%, #8A6418); box-shadow: 0 2px 3px rgba(0, 0, 0, .4); }
.lo-leaf .dnd { position: absolute; right: 2px; top: 118px; z-index: 1; padding: 6px 6px 7px; border-radius: 4px; background: #E4402A; color: #fff; font: 800 9.5px/1.1 var(--lo-f); font-style: normal; text-transform: uppercase; letter-spacing: .04em; rotate: 6deg; transform-origin: 70% 0; animation: loswing 3s ease-in-out infinite; }
@keyframes loswing { 50% { rotate: -4deg; } }
.lo-door.knock .lo-leaf { animation: loknock .4s; }
@keyframes loknock { 20%, 60% { translate: 2px 0; } 40%, 80% { translate: -2px 0; } }
.lo-door.open .lo-leaf { transform: rotateY(-102deg); }
.lo-door:hover:not(.open) .lo-leaf { transform: rotateY(-8deg); }
.lo-door:focus-visible { outline: 3px solid var(--lo-gold); outline-offset: 4px; }
.lo-gap { flex: none; position: relative; display: grid; place-items: center; width: 148px; height: 236px; scroll-snap-align: center; }
.lo-ghost { position: absolute; inset: 0 8px; border: 3px dashed color-mix(in srgb, var(--lo-ink) 30%, transparent); border-bottom: 0; border-radius: 6px 6px 0 0; }
.lo-note { position: relative; margin: 0; padding: 14px 12px 16px; background: #FFF3A8; color: #3A3320; font: 700 14px/1.3 "Gaegu", "Comic Sans MS", cursive; rotate: -4deg; box-shadow: 0 10px 18px -10px rgba(0, 0, 0, .5); animation: lonote 4s ease-in-out infinite; }
.lo-note::before { content: ""; position: absolute; left: 50%; top: -9px; width: 46px; height: 16px; margin-left: -23px; background: rgba(255, 255, 255, .55); rotate: 3deg; }
.lo-note small { font-size: 12px; opacity: .8; }
@keyframes lonote { 50% { rotate: -1deg; translate: 0 -2px; } }
.lo-carpet { height: 64px; margin: 0 -10%; background: repeating-linear-gradient(90deg, transparent 0 40px, rgba(255, 210, 120, .14) 40px 44px), linear-gradient(var(--lo-gold) 0 4px, var(--lo-carpet) 4px calc(100% - 4px), var(--lo-gold) calc(100% - 4px));
  transform: perspective(300px) rotateX(38deg); transform-origin: 50% 0; }
/* lights off: a flashlight follows you */
.lo-dark { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .6s;
  background: radial-gradient(circle 150px at var(--mx) var(--my), rgba(255, 240, 200, .06) 0, transparent 60%, rgba(6, 8, 12, .7) 75%, rgba(6, 8, 12, .95) 100%); }
.lo-hall.off .lo-dark { opacity: 1; }
.lo-hall.off .lo-lamp i { background: #5A5040; box-shadow: none; animation: none; }
.lo-count { margin: 22px 0 0; font: 700 14px/1.3 var(--lo-f); color: var(--lo-ink2); }
.lo-count.all { color: #E4402A; }

/* the front desk */
.lo-desk { position: relative; display: grid; justify-items: center; gap: 12px; margin: 6vh auto 0; max-width: 420px; padding: 0 20px; }
.lo-boy { position: relative; width: 70px; height: 92px; opacity: 0; translate: 0 20px; transition: opacity .5s, translate .7s var(--spring, cubic-bezier(.34, 1.56, .64, 1)); }
.lo-boy.on { opacity: 1; translate: 0 0; animation: loboy 1.6s ease-in-out .7s infinite; }
@keyframes loboy { 50% { translate: 0 -4px; } }
.lo-boy i { position: absolute; left: 50%; display: block; translate: -50% 0; }
.lo-boy .cap { top: 0; width: 34px; height: 14px; border-radius: 4px 4px 2px 2px; background: #C8161E; box-shadow: inset 0 -3px 0 var(--lo-gold); z-index: 2; }
.lo-boy .face { top: 10px; width: 34px; height: 34px; border-radius: 50%; background: #E9B98C; }
.lo-boy .face::before, .lo-boy .face::after { content: ""; position: absolute; top: 14px; width: 4px; height: 5px; border-radius: 50%; background: #2A1C12; }
.lo-boy .face::before { left: 10px; } .lo-boy .face::after { right: 10px; }
.lo-boy .body { top: 44px; width: 52px; height: 48px; border-radius: 16px 16px 6px 6px; background: #C8161E; box-shadow: inset 0 0 0 0 transparent, inset 0 -6px 0 rgba(0, 0, 0, .15); }
.lo-boy .body::before { content: ""; position: absolute; left: 50%; top: 6px; width: 4px; height: 30px; margin-left: -2px; background: repeating-linear-gradient(var(--lo-gold) 0 4px, transparent 4px 9px); }
.lo-say { position: relative; margin: 0; padding: 12px 16px; border-radius: 16px; background: color-mix(in srgb, var(--lo-ink) 6%, transparent); font: 700 16px/1.35 var(--lo-f); min-height: 1.35em; }
.lo-bell { position: relative; width: 92px; height: 70px; border: 0; padding: 0; background: none; cursor: pointer; }
.lo-bell i { position: absolute; left: 50%; display: block; translate: -50% 0; }
.lo-bell .lo-bb { top: 4px; width: 12px; height: 10px; border-radius: 4px 4px 0 0; background: #B8B8B8; }
.lo-bell .dome { top: 12px; width: 70px; height: 40px; border-radius: 40px 40px 4px 4px; background: radial-gradient(60% 70% at 35% 30%, #FFF6D6, #E8C063 45%, #A97C22); box-shadow: 0 10px 16px -10px rgba(0, 0, 0, .5); }
.lo-bell .base { top: 52px; width: 88px; height: 10px; border-radius: 4px; background: #2E2A26; }
.lo-bell.ring .lo-bb { animation: lopress .25s; } .lo-bell.ring .dome { animation: loring .6s; }
@keyframes lopress { 50% { translate: -50% 5px; } }
@keyframes loring { 20% { rotate: -6deg; } 40% { rotate: 5deg; } 60% { rotate: -3deg; } 80% { rotate: 1deg; } }
.lo-go { display: inline-flex; align-items: center; gap: 8px; margin-top: 4vh; padding: 16px 26px; border: 0; border-radius: 999px; cursor: pointer; text-decoration: none; font: 800 17px/1 var(--lo-f); color: var(--lo-ink);
  background: rgba(228, 64, 42, .12); box-shadow: inset 0 0 0 1.5px rgba(228, 64, 42, .5), 0 14px 28px -16px rgba(228, 64, 42, .7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); }
.lo-go:hover { transform: translateY(-2px); }
.lo-go.glow { animation: loglow 1.4s ease-in-out infinite; }
@keyframes loglow { 50% { box-shadow: inset 0 0 0 1.5px rgba(228, 64, 42, .8), 0 0 0 8px rgba(228, 64, 42, .12), 0 14px 28px -12px rgba(228, 64, 42, .8); transform: translateY(-2px); } }
@media (max-width: 760px) {
  .lo-hall { border-radius: 0; }
  .lo-row { justify-content: flex-start; padding: 60px 30vw 0; }
  .lo-door, .lo-gap { width: 122px; height: 220px; }
  .lo-leaf::after { height: 70px; }
}
@media (prefers-reduced-motion: reduce) { .lo-n i, .lo-lamp i, .lo-note, .lo-leaf .dnd, .lo-boy.on, .lo-go.glow { animation: none; } }
.lost { position: relative; min-height: 100vh; min-height: 100svh; opacity: 1; visibility: visible; }
</style>
</head>
<body>
<main class="lost open" id="lost" aria-label="Page not found"></main>
<script>
// ---------- 404: room 404 doesn't exist ----------
const LOST_DOORS = [['401', 'Unauthorized', '🧹', 'Staff only. Even I don’t have the key.'],
  ['402', 'Payment required', '🍫', 'The minibar. ₹400 for a chocolate? I’ll pass.'],
  ['403', 'Forbidden', '🙈', 'My first-ever wireframes. Nobody sees these.'],
  ['405', 'Method not allowed', '🧱', 'You tried to push. It’s a pull door. Painted on a wall.']];
function lostHTML(home) {
  const door = ([n, c, e, t], i) => `<button type="button" class="lo-door" data-i="${i}" aria-label="Room ${n}, knock"><span class="lo-in"><span class="e">${e}</span><b>${n} · ${c}</b><small>${t}</small></span><span class="lo-leaf"><span class="pl">${n}</span><i class="kn"></i>${i === 2 ? '<em class="dnd">Do not<br>disturb</em>' : ''}</span></button>`;
  const lamp = '<span class="lo-lamp" aria-hidden="true"><i></i></span>';
  return `<div class="lo-top"><span class="lo-brand">James Chugh</span><button type="button" class="lo-lights" id="loLights" aria-pressed="false"><span>💡</span><b>Lights off</b></button></div>
  <header class="lo-hd"><p class="lo-k">Error 404 · Hotel Valley, 4th floor</p>
    <h1>Room <span class="lo-n"><i>4</i><i>0</i><i>4</i></span> doesn’t exist.</h1>
    <p class="lo-sub">You took a wrong turn somewhere in the valley. Knock on a few doors, or ring the bell at the desk for help.</p></header>
  <div class="lo-hall" id="loHall">
    <div class="lo-row">${lamp}${door(LOST_DOORS[0], 0)}${lamp}${door(LOST_DOORS[1], 1)}${lamp}${door(LOST_DOORS[2], 2)}${lamp}
      <div class="lo-gap"><span class="lo-ghost" aria-hidden="true"></span><p class="lo-note">Room 404<br>checked out.<br><small>No forwarding address.</small></p></div>${lamp}${door(LOST_DOORS[3], 3)}${lamp}</div>
    <div class="lo-carpet" aria-hidden="true"></div>
    <div class="lo-dark" aria-hidden="true"></div>
  </div>
  <p class="lo-count" id="loCount">Doors knocked: 0 of 4</p>
  <div class="lo-desk">
    <div class="lo-boy" id="loBoy" aria-hidden="true"><i class="cap"></i><i class="face"></i><i class="body"></i></div>
    <p class="lo-say" id="loSay">Need a hand? Ring the bell.</p>
    <button type="button" class="lo-bell" id="loBell" aria-label="Ring the front desk bell"><i class="dome"></i><i class="lo-bb"></i><i class="base"></i></button>
  </div>
  ${home}`;
}
function initLost(root) {
  const $l = s => root.querySelector(s), $$l = s => [...root.querySelectorAll(s)];
  const hall = $l('#loHall'), say = $l('#loSay'), count = $l('#loCount'), boy = $l('#loBoy'), lights = $l('#loLights'), go = $l('.lo-go');
  const seen = new Set();
  let ac = null;
  const ding = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime;
    [[2093, .32], [3140, .12]].forEach(([f, v]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.7); }); } catch (_) {} };
  const knock = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t0 = ac.currentTime;
    [0, .16].forEach(d => { const t = t0 + d, o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(70, t + .08); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .12); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .14); }); } catch (_) {} };
  $$l('.lo-door').forEach(d => d.addEventListener('click', () => {
    if (d.classList.contains('open')) { d.classList.remove('open'); return; }
    if (d.classList.contains('knock')) return;
    d.classList.add('knock'); knock();
    setTimeout(() => { d.classList.remove('knock'); d.classList.add('open'); seen.add(d.dataset.i);
      count.textContent = seen.size < 4 ? `Doors knocked: ${seen.size} of 4` : 'Every door tried. Room 404 really is gone.';
      if (seen.size === 4) { count.classList.add('all'); say.textContent = 'Told you. Ring the bell, I’ll walk you home.'; } }, 420);
  }));
  const lines = ['Ding! Coming, coming…', 'Lost? Happens to the best of us.', 'The valley is this way. Follow me →', 'Okay, okay, I heard you! 😅'];
  let rings = 0;
  $l('#loBell').addEventListener('click', e => { const b = e.currentTarget; b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring'); ding();
    say.textContent = lines[Math.min(rings, lines.length - 1)]; rings++; boy.classList.add('on'); if (rings > 1 && go) go.classList.add('glow'); });
  // the lights: on by day, off at night (with a flashlight)
  const setDark = on => { hall.classList.toggle('off', on); root.classList.toggle('lo-off', on); lights.setAttribute('aria-pressed', on); lights.querySelector('b').textContent = on ? 'Lights on' : 'Lights off'; };
  setDark(document.documentElement.dataset.theme === 'dark');
  lights.addEventListener('click', () => setDark(!hall.classList.contains('off')));
  const aim = e => { const r = hall.getBoundingClientRect(); hall.style.setProperty('--mx', (e.clientX - r.left) + 'px'); hall.style.setProperty('--my', (e.clientY - r.top) + 'px'); };
  hall.addEventListener('pointermove', aim); hall.addEventListener('pointerdown', aim);
}
const el = document.getElementById('lost');
el.innerHTML = lostHTML('<a class="lo-go" href="./">Take me home →</a>');
initLost(el);
</script>
</body>
</html>
